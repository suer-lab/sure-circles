name: Feature request
description: Propose a new capability or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or goal
      description: What are you trying to achieve, and who is it for?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and privacy impact
      description: Does this change what is revealed on-chain, who can move funds, or the trust assumptions?
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      multiple: true
      options:
        - app
        - circuits
        - contracts
        - client SDK (packages/client)
        - core (packages/core)
        - scripts
        - docs
        - tooling
