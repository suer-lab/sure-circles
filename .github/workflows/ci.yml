# Offline CI for Sure Circles.
#
# Everything here is hermetic with respect to Stellar: no Testnet or Horizon access, no secrets, no deployment,
# and no trusted-setup generation. Network use is limited to fetching locked dependencies (npm registry,
# crates.io) and the pinned Rust toolchain. See docs/ci.md for the action-pinning review and what is
# deliberately not run yet.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with .nvmrc, package.json "engines", docs/dependency-decisions.md and rust-toolchain.toml.
  NODE_VERSION: "22.20.0"
  # npm 10 (bundled with Node 22) cannot resolve this lockfile; npm 11 can. See docs/dependency-decisions.md.
  NPM_VERSION: "11.21.1"
  RUST_TOOLCHAIN: "1.94.1"
  CARGO_TERM_COLOR: always

jobs:
  typescript:
    name: TypeScript (type-check, client, app, scripts)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install the pinned npm
        run: npm install --global "npm@${NPM_VERSION}" --ignore-scripts

      - name: Install dependencies (locked, no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Type-check, all six projects
        run: |
          set -e
          for project in packages/core packages/client scripts app app/e2e .; do
            echo "::group::tsc --noEmit -p ${project}"
            npx --no-install tsc --noEmit --pretty false -p "${project}"
            echo "::endgroup::"
          done

      - name: Client tests
        run: npm test --workspace=packages/client

      - name: App tests
        run: npm test --workspace=app

      - name: Scripts tests (hermetic)
        run: npm test --workspace=scripts

  core:
    # The Merkle-tree differential and property tests are deliberately slow (pure-TypeScript Poseidon; about
    # five minutes). They keep their full iteration counts and carry per-test timeouts, so this job gets a
    # generous job-level timeout instead of the tests being weakened.
    name: Core (slow Poseidon/Merkle tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install the pinned npm
        run: npm install --global "npm@${NPM_VERSION}" --ignore-scripts

      - name: Install dependencies (locked, no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Core tests
        timeout-minutes: 30
        run: npm test --workspace=packages/core

  contract:
    name: Contract (Rust fmt, test, clippy)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        # Uses the runner's preinstalled rustup and the exact version pinned in rust-toolchain.toml.
        # Tests and clippy build for the host; rust-toolchain.toml also lists wasm32v1-none, which rustup adds
        # automatically from the official distribution host on first use.
        working-directory: .
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version
          cargo --version

      - name: Format check
        run: cargo fmt --check

      - name: Tests (locked)
        run: cargo test --locked

      - name: Clippy (locked, warnings are errors)
        run: cargo clippy --locked --all-targets -- -D warnings

  static:
    name: Secret and static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Secret scan over every tracked file
        # Plain Node, no dependencies needed.
        run: npm run check:secrets -- --all

      - name: Stellar SDK version consistency
        run: npm run check:stellar-sdk
